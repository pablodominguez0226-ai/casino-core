services:
  postgres:
    image: postgres:16-alpine
    container_name: casinocore-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casinocore}
      POSTGRES_USER: ${POSTGRES_USER:-casinocore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casinocore_password}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casinocore_user} -d ${POSTGRES_DB:-casinocore}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - casinocore-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: casinocore-backend-prod
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-CasinoCore}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-casinocore-super-secure-jwt-secret-key-at-least-32-chars-long!}
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-casinocore}
      POSTGRES_USER: ${POSTGRES_USER:-casinocore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casinocore_password}
      POSTGRES_ECHO: "false"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - casinocore-network

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casinocore-nginx-prod
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - casinocore-network

volumes:
  postgres_data_prod:
    name: casinocore_postgres_prod_data

networks:
  casinocore-network:
    name: casinocore-network
    driver: bridge
