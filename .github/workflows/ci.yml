name: CasinoCore CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test-backend:
    name: Backend Lint, Migrations & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: casinocore_test
          POSTGRES_USER: casinocore_user
          POSTGRES_PASSWORD: casinocore_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: casinocore_test
      POSTGRES_USER: casinocore_user
      POSTGRES_PASSWORD: casinocore_password
      SECRET_KEY: casinocore-ci-secret-key-at-least-32-chars-long!

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check backend

      - name: Run Alembic Database Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest with Coverage
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing

  build-frontend:
    name: Frontend TypeScript Validation & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Validate TypeScript and build assets
        run: |
          cd frontend
          npm run build

  docker-validation:
    name: Validate Dockerfiles & Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate production docker-compose syntax
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Build backend production Docker image
        run: |
          docker build -f backend/Dockerfile.prod -t casinocore-backend:ci ./backend

      - name: Build frontend production Docker image
        run: |
          docker build -f frontend/Dockerfile -t casinocore-frontend:ci ./frontend
